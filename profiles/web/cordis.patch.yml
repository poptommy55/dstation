# Ollama 本地模型（dsh-ollama）—— 2026-09-14 启用。
#
# 干什么：直接对接本机 Ollama，把它里面**已安装的模型动态读出来**，作为 DSH 的
# 可选模型；在「设置 → 模型 → Ollama（本地）」里可看、可选、可配。
#
# 与上一个（已删除的内嵌方案）的关键区别：**模型跑在 Ollama 自己的进程里**，
# 本插件只做协议翻译 + DSH 注册，因此
#   · 不把原生库加载进 DSH 进程 ⇒ 没有 CUDA 硬终止 / 反复重启的风险；
#   · 模型列表是动态读的（GET /api/tags）⇒ 你 `ollama pull` 了新模型，
#     插件这边自动就能选，不用改任何配置。
#   · **零第三方依赖**（只用 Node 内置模块）。
#
# 前提：Ollama 服务需在运行（默认 http://127.0.0.1:11434）。
# 注意 Ollama 默认 num_ctx 很小，而 DSH 的 agent 提示词约 18.5K，插件会显式
# 设置 num_ctx（默认 32768，可配），否则会被静默截断。
#
# 参数在「设置 → 模型 → Ollama（本地）」里改，或编辑
# %DSH_HOME%\settings.yaml 的 ollama: 段。
# 默认 promptMode='chat'：用短人设替换 DSH 的 agent 人设且不发送工具定义
# （实测 2B 级模型在 20K tokens 的 agent 提示词下会复述人设/拒绝回答/乱调工具）。
# 需要 agent 能力时改成 'agent'。
#
# 诊断：
#   GET /dsh-ollama/status   连接状态、版本、模型清单、注册情况
#   GET /dsh-ollama/models   动态模型列表
#   GET /dsh-ollama/selftest 走 ctx.llm.stream 的端到端验证（含真实回答）
# 卸载：删除下面这条 insert 即可。
- insert:
    - id: ollama
      name: dsh-ollama

# 「日常使用」分区的相对位置化（dsh-daily-workspace）—— 2026-09-14 启用。
#
# 干什么：确保「日常使用」分区以 **%DSH_HOME%\daily-use** 这个相对位置存在，
# 与超级智能体/智能体编排/知识库/技能使用那几个插件自建的分区保持一致
# （它们都是「DSH_HOME + 固定目录名」算出来并幂等创建的，删了会自动重建）。
# 原先「日常使用」是手动添加的绝对路径（D:\DSH\DH2\实验区），换部署就失效。
#
# 做法：宿主侧单文件、零依赖。启动时 mkdir 目录，再调
# ctx.workspaceRegistry.create(dir, '日常使用') —— create 对同一路径是幂等的
# （"Repeated calls for the same canonical path return the existing entity
# without changing its title"），所以每轮启动调用都安全，不会动已有会话归属。
# ⚠️ 必须先 mkdir：create 要求目录已存在，路径不存在会以原始错误 reject。
#
# 配套改动（不在本文件里，属于 DSH 本体补丁，务必知悉）：
#   为了让**点侧栏「新对话」时默认落在「日常使用」**，改了 DSH 的
#   app/node_modules/@deepseek-ai/dsh-client-ui-workspace/lib/client.js
#   里 startSession() 的 target 计算，按 canonical path 结尾匹配 daily-use。
#   该文件已被 DSH 覆盖过就会失效 —— 备份与重打方法见同目录的
#   client.js.bak-daily-default-* 与下方说明。
# 卸载：删除下面这条 insert 即可（补丁需另行还原，见上）。
- insert:
    - id: daily-workspace
      name: dsh-daily-workspace

# 窗口背景（dsh-wallpaper）—— 2026-09-14 启用。
#
# 干什么：给 Web GUI 设纯色 / 渐变 / 图片壁纸，并让侧栏与浮层半透明以透出背景。
# 入口在「设置 → 通用」第三行（与官方「外观」「正文字号」并排），
# 用的就是 DSH 官方主题自己用的那个槽位 settings.general.item。
#
# 为什么走官方路子而不是注入 CSS 抢 DOM：
#   ① 背景色走 ctx.theme.overrideTokens()，它要求 light/dark 成对，
#      切配色时不会出现"只对一套有效"；
#   ② 壁纸图本身用插件自有的 <style>（令牌表达不了图片）；
#   ③ 首屏由宿主经 webserver/index-inject 注入，避免加载后闪一下才变。
#
# 壁纸文件存在 %DSH_HOME%\wallpapers\ ，由插件上传通道写入（文件名宿主生成，
# 用户不提供任何路径），因此没有路径穿越面。
#
# 诊断：GET /dsh-wallpaper/health
# 卸载：见下方「迁移到 bundle 通道」的说明。
#
# ⚠️ 2026-09-14 迁移到 **bundle 通道**：这里的**手动 mount 行已删除**。
#    现在由插件包自带的 cordis.patch.yml（package.json 的 dsh.bundle.patch）
#    提供这条 insert，profile 启动时自动合并 —— profile package.json 的
#    `dsh.profile.bundles` 里已经有 "dsh-wallpaper"。
#
#    为什么必须删掉这一行：两处同时挂载 = **双重挂载**，
#    宿主半会注册两次同名路由 ⇒ 启动失败
#    （`webserver: duplicate exact route "/dsh-wallpaper/config"`）。
#    dsh-better-sidebar 的补丁注释里也专门警告过这一点。
#
#    要卸载：运行插件目录里的 uninstall.ps1，或手工从
#    profile package.json 的 dsh.profile.bundles 里删掉 "dsh-wallpaper"。
#
# 2026-09-14：本插件曾被看门狗自动禁用一次（`- id: wallpaper` / `disabled: true`），
# 原因是宿主半在同一个 path 上注册了两条 exact 路由；已把 GET/POST 合并成一条，
# 故移除该禁用条目。

